<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bookings - Cargo Management</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="core.js"></script>
</head>
<body class="bg-gradient-to-br from-green-50 to-teal-50">
  <div class="min-h-screen">
    <!-- Header -->
    <header class="bg-gradient-to-r from-green-600 to-teal-600 text-white shadow-lg w-full">
      <div class="w-full px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center text-green-600 font-bold text-2xl shadow-md">📦</div>
          <div>
            <h1 class="text-xl font-bold text-white">Cargo Management System</h1>
            <p class="text-xs text-green-100">Booking & Reservations</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <span id="userName" class="text-sm font-medium"></span>
          <a href="admin.html" class="px-3 py-2 text-sm bg-white/20 hover:bg-white/30 rounded-lg transition">Dashboard</a>
        </div>
      </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-8">
      <!-- Action Bar -->
      <div class="mb-6 flex items-center justify-between">
        <h2 class="text-2xl font-bold text-gray-800">Container Bookings</h2>
        <button id="newBookingBtn" class="px-4 py-2 bg-gradient-to-r from-green-600 to-teal-600 hover:from-green-700 hover:to-teal-700 text-white rounded-lg font-medium shadow-md transition flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          New Booking
        </button>
      </div>

      <!-- Stats Cards -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-xl shadow-md p-4 border-l-4 border-green-500">
          <div class="text-sm text-gray-500">Total Bookings</div>
          <div id="statTotal" class="text-2xl font-bold text-gray-800">0</div>
        </div>
        <div class="bg-white rounded-xl shadow-md p-4 border-l-4 border-yellow-500">
          <div class="text-sm text-gray-500">Pending</div>
          <div id="statPending" class="text-2xl font-bold text-yellow-600">0</div>
        </div>
        <div class="bg-white rounded-xl shadow-md p-4 border-l-4 border-blue-500">
          <div class="text-sm text-gray-500">Confirmed</div>
          <div id="statConfirmed" class="text-2xl font-bold text-blue-600">0</div>
        </div>
        <div class="bg-white rounded-xl shadow-md p-4 border-l-4 border-gray-500">
          <div class="text-sm text-gray-500">Cancelled</div>
          <div id="statCancelled" class="text-2xl font-bold text-gray-600">0</div>
        </div>
      </div>

      <!-- Bookings Table -->
      <div class="bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-gradient-to-r from-green-600 to-teal-600 text-white">
              <tr>
                <th class="px-4 py-3 text-left text-sm font-semibold">Booking ID</th>
                <th class="px-4 py-3 text-left text-sm font-semibold">Customer</th>
                <th class="px-4 py-3 text-left text-sm font-semibold">Container Type</th>
                <th class="px-4 py-3 text-left text-sm font-semibold">Pickup Date</th>
                <th class="px-4 py-3 text-left text-sm font-semibold">Drop Date</th>
                <th class="px-4 py-3 text-left text-sm font-semibold">Status</th>
                <th class="px-4 py-3 text-left text-sm font-semibold">Actions</th>
              </tr>
            </thead>
            <tbody id="bookingsTable" class="divide-y divide-gray-100">
              <tr><td colspan="7" class="px-4 py-8 text-center text-gray-500">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- New Booking Dialog -->
  <dialog id="bookingDialog" class="rounded-2xl shadow-2xl border-0 backdrop:bg-black/50 max-w-2xl w-full">
    <form id="bookingForm" method="dialog" class="w-full p-6">
      <div class="flex items-center justify-between mb-6 pb-4 border-b">
        <h3 class="text-2xl font-bold text-gray-800">New Booking</h3>
        <button value="cancel" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
      </div>

      <div class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <label class="block">
            <span class="text-sm font-medium text-gray-700">Customer Name *</span>
            <input id="bCustomer" required placeholder="e.g., John Doe" class="w-full mt-1 px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
          </label>
          <label class="block">
            <span class="text-sm font-medium text-gray-700">Contact Number *</span>
            <input id="bContact" type="tel" required placeholder="e.g., +91 9876543210" class="w-full mt-1 px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
          </label>
        </div>

        <label class="block">
          <span class="text-sm font-medium text-gray-700">Email</span>
          <input id="bEmail" type="email" placeholder="customer@example.com" class="w-full mt-1 px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
        </label>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <label class="block">
            <span class="text-sm font-medium text-gray-700">Container Type *</span>
            <select id="bType" required class="w-full mt-1 px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
              <option value="">Select Type</option>
              <option>Dry</option>
              <option>Reefer</option>
              <option>OpenTop</option>
              <option>FlatRack</option>
              <option>Tank</option>
            </select>
          </label>
          <label class="block">
            <span class="text-sm font-medium text-gray-700">Container Size *</span>
            <select id="bSize" required class="w-full mt-1 px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
              <option value="">Select Size</option>
              <option>20ft</option>
              <option>40ft</option>
              <option>45ft</option>
            </select>
          </label>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <label class="block">
            <span class="text-sm font-medium text-gray-700">Pickup Date *</span>
            <input id="bPickupDate" type="date" required class="w-full mt-1 px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
          </label>
          <label class="block">
            <span class="text-sm font-medium text-gray-700">Drop Date *</span>
            <input id="bDropDate" type="date" required class="w-full mt-1 px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
          </label>
        </div>

        <label class="block">
          <span class="text-sm font-medium text-gray-700">Pickup Location *</span>
          <input id="bPickupLocation" required placeholder="e.g., Mumbai Port, Gate 3" class="w-full mt-1 px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
        </label>

        <label class="block">
          <span class="text-sm font-medium text-gray-700">Drop Location *</span>
          <input id="bDropLocation" required placeholder="e.g., Warehouse B, Pune" class="w-full mt-1 px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
        </label>

        <label class="block">
          <span class="text-sm font-medium text-gray-700">Special Requirements</span>
          <textarea id="bRemarks" rows="3" placeholder="Any special instructions..." class="w-full mt-1 px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"></textarea>
        </label>
      </div>

      <div class="flex gap-3 justify-end pt-4 mt-6 border-t">
        <button type="button" value="cancel" class="px-6 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg font-medium transition">Cancel</button>
        <button value="default" class="px-6 py-2.5 bg-gradient-to-r from-green-600 to-teal-600 hover:from-green-700 hover:to-teal-700 text-white rounded-lg font-medium transition shadow-md">Create Booking</button>
      </div>
    </form>
  </dialog>

  <script src="bookings.js"></script>
</body>
</html>
