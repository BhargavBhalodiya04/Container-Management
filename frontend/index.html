<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cargo Management System - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm sm:max-w-md">
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100 w-full">
      <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 text-center">
        <div class="mx-auto w-16 h-16 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center mb-4">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-white">Cargo Management System</h1>
        <p class="text-blue-100 mt-1">Sign in to your account</p>
      </div>
      
      <div class="p-6 w-full">
        <form id="loginForm" class="space-y-4 w-full">
          <div class="w-full">
            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <div class="relative w-full">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none login-icon-container">
                <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
              </div>
              <input type="text" id="username" placeholder="Username" required 
                     class="w-full pl-10 pr-3 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition login-input" />
            </div>
          </div>
          
          <div class="w-full">
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <div class="relative w-full">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none login-icon-container">
                <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
              </div>
              <input type="password" id="password" placeholder="Password" required 
                     class="w-full pl-10 pr-10 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition login-input" />
              <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center">
                <svg class="h-5 w-5 text-gray-400 hover:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path id="eyeIcon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  <path id="eyeSlashIcon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                </svg>
              </button>
            </div>
          </div>
          
          <div class="flex items-center justify-between">
            <div class="flex items-center">
              <input id="rememberMe" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
              <label for="rememberMe" class="ml-2 block text-sm text-gray-700">Remember me</label>
            </div>
            <div class="text-sm">
              <a href="#" class="font-medium text-blue-600 hover:text-blue-500">Forgot password?</a>
            </div>
          </div>
          
          <button type="submit" 
                  class="w-full bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-700 hover:to-indigo-800 text-white font-medium py-2.5 rounded-lg transition shadow-md hover:shadow-lg">
            Sign In
          </button>
        </form>
      </div>
    </div>
    
        <div class="mt-6 text-center">
          <p class="text-gray-600">
            Don't have an account? 
            <a href="register.html" class="font-medium text-blue-600 hover:text-blue-500">Create one</a>
          </p>
        </div>
      </div>
    </div>
    
    <!-- <p class="mt-6 text-center text-sm text-gray-500">
      &copy; 2024 Cargo Management System. All rights reserved.
    </p> -->
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;
      
      // Form validation
      if (!username || !password) {
        showError('Please enter both username and password');
        return;
      }
      
      // Show loading state
      const submitButton = document.querySelector('#loginForm button[type="submit"]');
      const originalButtonText = submitButton.innerHTML;
      submitButton.innerHTML = `
        <div class="flex items-center justify-center">
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Signing in...
        </div>
      `;
      submitButton.disabled = true;
      
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password }),
        });
        
        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Login failed');
        }
        
        const { token, user } = await response.json();
        
        // Store token and user in localStorage
        localStorage.setItem('cms_token', token);
        localStorage.setItem('cms_user', JSON.stringify(user));
        
        // Handle remember me functionality
        if (rememberMe) {
          localStorage.setItem('cms_remember_me', 'true');
          // Store username for auto-fill (but NOT password for security)
          localStorage.setItem('cms_username', username);
        } else {
          localStorage.removeItem('cms_remember_me');
          localStorage.removeItem('cms_username');
        }
        
        // Redirect based on user role
        if (user.role === 'admin') {
          location.href = 'admin.html';
        } else {
          location.href = 'user.html';
        }
      } catch (err) {
        // Reset button state
        submitButton.innerHTML = originalButtonText;
        submitButton.disabled = false;
        
        // Show error message
        const errorMessage = err.message.includes('Invalid username or password') 
          ? 'Invalid username or password. Please check your credentials and try again.' 
          : err.message;
        
        showError(errorMessage);
      }
    });
    
    // Initialize eye icons
    document.getElementById('eyeSlashIcon').style.display = 'none';
    
    // Password visibility toggle
    document.getElementById('togglePassword').addEventListener('click', function() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      const eyeSlashIcon = document.getElementById('eyeSlashIcon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.style.display = 'none';
        eyeSlashIcon.style.display = 'block';
      } else {
        passwordInput.type = 'password';
        eyeIcon.style.display = 'block';
        eyeSlashIcon.style.display = 'none';
      }
    });
    
    // Show error message function
    function showError(message) {
      const form = document.getElementById('loginForm');
      let errorDiv = document.getElementById('login-error');
      
      if (!errorDiv) {
        errorDiv = document.createElement('div');
        errorDiv.id = 'login-error';
        errorDiv.className = 'rounded-lg bg-red-50 border border-red-200 p-4 mb-4';
        form.insertBefore(errorDiv, form.firstChild);
      }
      
      errorDiv.innerHTML = `
        <div class="flex">
          <div class="flex-shrink-0">
            <svg class="h-5 w-5 text-red-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
            </svg>
          </div>
          <div class="ml-3">
            <h3 class="text-sm font-medium text-red-800">${message}</h3>
          </div>
        </div>
      `;
      
      // Clear the error message after 5 seconds
      setTimeout(() => {
        if (errorDiv.parentNode) {
          errorDiv.parentNode.removeChild(errorDiv);
        }
      }, 5000);
    }
    
    // Auto-fill username if "Remember me" was previously checked
    document.addEventListener('DOMContentLoaded', function() {
      const rememberMe = localStorage.getItem('cms_remember_me');
      const savedUsername = localStorage.getItem('cms_username');
      
      if (rememberMe === 'true' && savedUsername) {
        document.getElementById('username').value = savedUsername;
        document.getElementById('rememberMe').checked = true;
      }
    });
    
    // Clear any existing auth data when loading the login page
    localStorage.removeItem('cms_token');
    localStorage.removeItem('cms_user');
  </script>
</body>
</html>
