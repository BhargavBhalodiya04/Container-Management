<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Container Requests - Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="core.js"></script>
</head>
<body class="bg-gradient-to-br from-orange-50 to-yellow-50">
  <div class="min-h-screen">
    <!-- Header -->
    <header class="bg-gradient-to-r from-orange-600 to-yellow-600 text-white shadow-lg w-full">
      <div class="w-full px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center text-orange-600 font-bold text-2xl shadow-md">📋</div>
          <div>
            <h1 class="text-xl font-bold text-white">Cargo Management System</h1>
            <p class="text-xs text-orange-100">Container Requests</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <span id="userName" class="text-sm font-medium"></span>
          <a href="admin.html" class="px-3 py-2 text-sm bg-white/20 hover:bg-white/30 rounded-lg transition">Dashboard</a>
        </div>
      </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-8">
      <!-- Header -->
      <div class="mb-6">
        <h2 class="text-2xl font-bold text-gray-800">Container Requests</h2>
        <p class="text-gray-600">Manage user container requests</p>
      </div>

      <!-- Stats Cards -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-xl shadow-md p-4 border-l-4 border-orange-500 hover:shadow-lg transition">
          <div class="text-sm text-gray-500">Total Requests</div>
          <div id="statTotal" class="text-2xl font-bold text-gray-800">0</div>
        </div>
        <div class="bg-white rounded-xl shadow-md p-4 border-l-4 border-yellow-500 hover:shadow-lg transition">
          <div class="text-sm text-gray-500">Pending</div>
          <div id="statPending" class="text-2xl font-bold text-yellow-600">0</div>
        </div>
        <div class="bg-white rounded-xl shadow-md p-4 border-l-4 border-green-500 hover:shadow-lg transition">
          <div class="text-sm text-gray-500">Approved</div>
          <div id="statApproved" class="text-2xl font-bold text-green-600">0</div>
        </div>
        <div class="bg-white rounded-xl shadow-md p-4 border-l-4 border-red-500 hover:shadow-lg transition">
          <div class="text-sm text-gray-500">Rejected</div>
          <div id="statRejected" class="text-2xl font-bold text-red-600">0</div>
        </div>
      </div>

      <!-- Requests Table -->
      <div class="bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-gradient-to-r from-orange-600 to-yellow-600 text-white">
              <tr>
                <th class="px-4 py-3 text-left text-sm font-semibold">Request ID</th>
                <th class="px-4 py-3 text-left text-sm font-semibold">User</th>
                <th class="px-4 py-3 text-left text-sm font-semibold">Container</th>
                <th class="px-4 py-3 text-left text-sm font-semibold">Required Date</th>
                <th class="px-4 py-3 text-left text-sm font-semibold">Duration</th>
                <th class="px-4 py-3 text-left text-sm font-semibold">Route</th>
                <th class="px-4 py-3 text-left text-sm font-semibold">Status</th>
                <th class="px-4 py-3 text-left text-sm font-semibold">Actions</th>
              </tr>
            </thead>
            <tbody id="requestsTable" class="divide-y divide-gray-100">
              <tr><td colspan="8" class="px-4 py-8 text-center text-gray-500">📭 Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Rejection Dialog -->
  <dialog id="rejectDialog" class="rounded-2xl shadow-2xl border-0 backdrop:bg-black/50 max-w-md w-full">
    <form id="rejectForm" method="dialog" class="w-full p-6">
      <div class="flex items-center justify-between mb-6 pb-4 border-b">
        <h3 class="text-xl font-bold text-gray-800">Reject Request</h3>
        <button value="cancel" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
      </div>

      <input type="hidden" id="rejectRequestId">

      <div class="space-y-4">
        <label class="block">
          <span class="text-sm font-medium text-gray-700">Reason for Rejection *</span>
          <textarea id="rejectReason" required rows="4" placeholder="Enter reason..." class="w-full mt-1 px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500"></textarea>
        </label>
      </div>

      <div class="flex gap-3 justify-end pt-4 mt-6 border-t">
        <button type="button" value="cancel" class="px-6 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg font-medium transition">Cancel</button>
        <button value="default" class="px-6 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium transition shadow-md">Reject Request</button>
      </div>
    </form>
  </dialog>

  <script src="requests.js"></script>
</body>
</html>
