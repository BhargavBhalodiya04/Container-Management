<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tasks - Container Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100">
  <header class="bg-gradient-to-r from-green-600 to-teal-700 text-white shadow-lg w-full">
    <div class="w-full px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center text-green-600 font-bold text-2xl shadow-md">U</div>
        <div>
          <h1 class="text-xl font-bold text-white">Cargo Management System</h1>
          <p class="text-xs text-green-100">User Dashboard</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button id="notificationBtn" class="relative p-2 bg-white/10 hover:bg-white/20 rounded-lg transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
          <span id="notificationBadge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full min-w-[20px] h-5 flex items-center justify-center px-1">0</span>
        </button>
        <span id="userName" class="text-sm font-medium"></span>
        <button id="logoutBtn" class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white text-sm rounded-lg transition shadow-md">Logout</button>
      </div>
    </div>
  </header>

  <!-- Notifications Dropdown -->
  <div id="notificationsDropdown" class="absolute right-4 top-20 bg-white rounded-lg shadow-xl border border-gray-200 w-80 z-50 hidden">
    <div class="p-4 border-b border-gray-200">
      <h3 class="font-bold text-gray-800">Notifications</h3>
    </div>
    <div id="notificationsList" class="max-h-96 overflow-y-auto">
      <!-- Notifications will be populated here -->
      <div class="p-4 text-center text-gray-500">No notifications</div>
    </div>
    <div class="p-2 border-t border-gray-200 text-center">
      <button id="markAllReadBtn" class="text-sm text-green-600 hover:text-green-800">Mark all as read</button>
    </div>
  </div>
  <main class="max-w-7xl mx-auto px-4 py-6">
    <section id="tasks">
      <h2 class="text-2xl font-bold text-gray-800 mb-6">My Tasks</h2>
      
      <!-- Filter Controls -->
      <div class="bg-white rounded-xl shadow-md p-4 mb-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div>
            <label class="block text-gray-700 text-sm font-medium mb-2" for="searchInput">Search</label>
            <input type="text" id="searchInput" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent" placeholder="Search tasks...">
          </div>
          <div>
            <label class="block text-gray-700 text-sm font-medium mb-2" for="statusFilter">Status</label>
            <select id="statusFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent">
              <option value="">All Statuses</option>
              <option value="Pending">Pending</option>
              <option value="InProgress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
          <div class="flex items-end">
            <button id="refreshBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition flex items-center">
              <i class="fas fa-sync-alt mr-2"></i> Refresh
            </button>
          </div>
        </div>
      </div>
      
      <!-- Tasks Table -->
      <div class="bg-white rounded-xl shadow-md overflow-hidden">
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
              <tr>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Container</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Issue</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Start Date</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Task Type</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
              </tr>
            </thead>
            <tbody id="tasksTableBody" class="bg-white divide-y divide-gray-200">
              <!-- Tasks will be populated here -->
              <tr>
                <td colspan="5" class="px-6 py-4 text-center text-gray-500">
                  Loading tasks...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- Task Detail Modal -->
  <div id="taskModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl mx-4">
      <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
        <h3 class="text-lg font-bold text-gray-800">Task Details</h3>
        <button id="closeTaskModal" class="text-gray-500 hover:text-gray-700">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="p-6" id="taskModalContent">
        <!-- Task details will be populated here -->
      </div>
    </div>
  </div>

  <script src="tasks.js"></script></body>
</html>
