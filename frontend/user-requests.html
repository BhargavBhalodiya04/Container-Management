<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My Requests - User Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="core.js"></script>
</head>
<body class="bg-gradient-to-br from-green-50 to-teal-100 min-h-screen">
  <header class="bg-gradient-to-r from-green-600 to-teal-700 text-white shadow-lg w-full">
    <div class="w-full px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center text-green-600 font-bold text-2xl shadow-md">📋</div>
        <div>
          <h1 class="text-xl font-bold text-white">My Container Requests</h1>
          <p class="text-xs text-green-100">User Dashboard</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span id="userName" class="text-sm font-medium"></span>
        <button id="logoutBtn" class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white text-sm rounded-lg transition shadow-md">Logout</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <div class="mb-6">
      <h2 class="text-2xl font-bold text-gray-800">My Container Requests</h2>
      <p class="text-gray-600">View and manage your container requests</p>
    </div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-xl shadow-md p-4 border-l-4 border-green-500 hover:shadow-lg transition">
        <div class="text-sm text-gray-500">Total Requests</div>
        <div id="statTotal" class="text-2xl font-bold text-gray-800">0</div>
      </div>
      <div class="bg-white rounded-xl shadow-md p-4 border-l-4 border-yellow-500 hover:shadow-lg transition">
        <div class="text-sm text-gray-500">Pending</div>
        <div id="statPending" class="text-2xl font-bold text-yellow-600">0</div>
      </div>
      <div class="bg-white rounded-xl shadow-md p-4 border-l-4 border-blue-500 hover:shadow-lg transition">
        <div class="text-sm text-gray-500">Approved</div>
        <div id="statApproved" class="text-2xl font-bold text-blue-600">0</div>
      </div>
      <div class="bg-white rounded-xl shadow-md p-4 border-l-4 border-red-500 hover:shadow-lg transition">
        <div class="text-sm text-gray-500">Rejected</div>
        <div id="statRejected" class="text-2xl font-bold text-red-600">0</div>
      </div>
    </div>

    <!-- New Request Button -->
    <div class="bg-white rounded-xl shadow-md p-4 mb-6">
      <button id="newRequestBtn" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg transition flex items-center gap-2 shadow-md">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
        New Request
      </button>
    </div>

    <!-- Requests Table -->
    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead class="bg-gradient-to-r from-green-600 to-teal-600 text-white">
            <tr>
              <th class="px-4 py-3 text-left text-sm font-semibold">Request ID</th>
              <th class="px-4 py-3 text-left text-sm font-semibold">Container</th>
              <th class="px-4 py-3 text-left text-sm font-semibold">Required Date</th>
              <th class="px-4 py-3 text-left text-sm font-semibold">Duration</th>
              <th class="px-4 py-3 text-left text-sm font-semibold">Route</th>
              <th class="px-4 py-3 text-left text-sm font-semibold">Status</th>
            </tr>
          </thead>
          <tbody id="requestsTable" class="divide-y divide-gray-100">
            <tr><td colspan="6" class="px-4 py-8 text-center text-gray-500">📭 No requests found</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- New Request Dialog -->
  <dialog id="requestDialog" class="rounded-2xl shadow-2xl border-0 backdrop:bg-black/50 max-w-md w-full">
    <form id="requestForm" method="dialog" class="w-full p-6">
      <div class="flex items-center justify-between mb-6 pb-4 border-b">
        <h3 class="text-xl font-bold text-gray-800">New Container Request</h3>
        <button value="cancel" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
      </div>

      <div class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <label class="block">
            <span class="text-sm font-medium text-gray-700">Container Type</span>
            <select id="containerType" class="w-full mt-1 px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
              <option value="">Select Type</option>
              <option>Dry</option>
              <option>Reefer</option>
              <option>OpenTop</option>
              <option>FlatRack</option>
              <option>Tank</option>
            </select>
          </label>
          <label class="block">
            <span class="text-sm font-medium text-gray-700">Container Size</span>
            <select id="containerSize" class="w-full mt-1 px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
              <option value="">Select Size</option>
              <option>20ft</option>
              <option>40ft</option>
              <option>45ft</option>
            </select>
          </label>
        </div>
        
        <label class="block">
          <span class="text-sm font-medium text-gray-700">Required Date</span>
          <input type="date" id="requiredDate" class="w-full mt-1 px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
        </label>
        
        <label class="block">
          <span class="text-sm font-medium text-gray-700">Duration (days)</span>
          <input type="number" id="duration" min="1" class="w-full mt-1 px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
        </label>
        
        <div class="grid grid-cols-2 gap-4">
          <label class="block">
            <span class="text-sm font-medium text-gray-700">Pickup Location</span>
            <input type="text" id="pickupLocation" placeholder="e.g., Mumbai Port" class="w-full mt-1 px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
          </label>
          <label class="block">
            <span class="text-sm font-medium text-gray-700">Delivery Location</span>
            <input type="text" id="deliveryLocation" placeholder="e.g., Delhi Warehouse" class="w-full mt-1 px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
          </label>
        </div>
        
        <label class="block">
          <span class="text-sm font-medium text-gray-700">Remarks</span>
          <textarea id="remarks" rows="3" placeholder="Any special requirements..." class="w-full mt-1 px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"></textarea>
        </label>
      </div>

      <div class="flex gap-3 justify-end pt-4 mt-6 border-t">
        <button type="button" value="cancel" class="px-6 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg font-medium transition">Cancel</button>
        <button value="default" class="px-6 py-2.5 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium transition shadow-md">Submit Request</button>
      </div>
    </form>
  </dialog>

  <script src="user-requests.js"></script>
</body>
</html>
