services:
  - type: web
    name: container-management-system
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: RENDER_DB_PATH
        value: /opt/render/project/src/data/cargo_management.db
      - key: JWT_SECRET
        generateValue: true
